# LiteLLM proxy config.
# n8n calls http://litellm:4000/v1/chat/completions (OpenAI-compatible).
# Change the model here; n8n workflows never need updating.

model_list:
  # --- Option E: Gemini Flash (Google AI Studio key) [ENABLED] ---
  - model_name: default
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      web_search_options:
        search_context_size: "low"

  - model_name: fallback_vertex
    litellm_params:
      model: vertex_ai/gemini-3.7-flash
      vertex_project: os.environ/GEMINI_PROJECT_ID
      vertex_location: "global"
      web_search_options:
        search_context_size: "low"

  - model_name: fallback
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      web_search_options:
        search_context_size: "low"

litellm_settings:
  drop_params: true       # ignore unknown params silently
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # any random string; n8n sends this as Bearer token
  store_model_in_db: true
  store_prompts_in_spend_logs: true

router_settings:
  fallbacks:
    - default: ["fallback_vertex", "fallback"]
  num_retries: 1
  retry_policy:
    initial_delay: 2
    backoff_factor: 2
